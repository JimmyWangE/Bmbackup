name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bm
          POSTGRES_PASSWORD: bm
          POSTGRES_DB: bm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bm" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: 迁移脚本能在空库上执行
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://bm:bm@localhost:5432/bm_test
      - name: 测试（SQLite）
        run: pytest -q
      - name: 测试（PostgreSQL）
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bm:bm@localhost:5432/bm_test
      - name: Docker 镜像能构建
        run: docker build -t bm-backend .
