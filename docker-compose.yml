# 单台服务器部署：Caddy（自动 HTTPS）→ API → PostgreSQL。照片语音存在 media 卷里。
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bm
      POSTGRES_DB: bm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bm -d bm"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      REQUIRE_HTTPS: "true"
      DATABASE_URL: postgresql+asyncpg://bm:${POSTGRES_PASSWORD}@db:5432/bm
      PUBLIC_BASE_URL: https://${DOMAIN:?在 .env 里设置 DOMAIN}
      LOCAL_STORAGE_DIR: /app/data/media
    volumes:
      - media:/app/data/media
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
